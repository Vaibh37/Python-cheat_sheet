<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 315" role="img" aria-label="NumPy one-dimensional vector shape (2,) compared with two-dimensional column array shape (2,1)"><rect width="940" height="315" fill="#f8fafc"/><text x="32" y="45" font-family="Arial,sans-serif" font-weight="700" font-size="29" fill="#19343a">Same values, different NumPy shapes</text><g font-family="Arial,sans-serif" fill="#19343a"><text x="55" y="105" font-size="22" font-weight="700">One-dimensional vector</text><text x="520" y="105" font-size="22" font-weight="700">Two-dimensional column</text></g><rect x="52" y="129" width="319" height="80" rx="14" fill="#dfedfb" stroke="#5283b2" stroke-width="2"/><text x="96" y="181" font-family="Arial" font-size="28" fill="#19343a">2</text><text x="278" y="181" font-family="Arial" font-size="28" fill="#19343a">-1</text><text x="398" y="181" font-family="Arial" font-size="30" fill="#19343a">≠</text><rect x="565" y="124" width="125" height="137" rx="14" fill="#e2f5ef" stroke="#278978" stroke-width="2"/><text x="623" y="179" text-anchor="middle" font-family="Arial" font-size="28" fill="#19343a">2</text><text x="623" y="236" text-anchor="middle" font-family="Arial" font-size="28" fill="#19343a">-1</text><text x="52" y="258" font-family="Arial" font-size="22" fill="#48616a">shape (2,) — ndim = 1</text><text x="565" y="292" font-family="Arial" font-size="22" fill="#48616a">shape (2,1) — ndim = 2</text></svg>